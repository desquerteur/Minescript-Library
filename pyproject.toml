[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["community", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "S101"]

[tool.coverage.run]
omit = ["community/*", "examples/*", "tests/*", "tools/*"]
